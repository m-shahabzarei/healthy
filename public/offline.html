<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080808">
  <title>آفلاین هستید · Healthy</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100dvh; display: grid; place-items: center; margin: 0; padding: 24px; background: #080808; color: #f7f7f7; }
    main { width: min(100%, 420px); padding: 36px; border: 1px solid #333; background: #121212; }
    img { width: 56px; height: 56px; border-radius: 12px; }
    h1 { margin: 28px 0 8px; font-size: 26px; line-height: 1.4; }
    p { color: #c5c5c5; line-height: 1.8; }
    .english { direction: ltr; text-align: left; font-size: 14px; }
    button { min-height: 46px; margin-top: 18px; padding: 10px 20px; border: 0; background: #f7f7f7; color: #080808; font: inherit; font-weight: 700; cursor: pointer; }
    button:focus-visible { outline: 2px solid #fff; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/mark.svg" alt="Healthy">
    <h1>اتصال اینترنت برقرار نیست</h1>
    <p>برای دیدن و ثبت اطلاعات حساب خود به اینترنت نیاز دارید. پس از اتصال دوباره تلاش کنید.</p>
    <p class="english" lang="en">You are offline. Connect to the internet to view or update your account.</p>
    <button type="button" onclick="location.reload()">تلاش دوباره / Retry</button>
  </main>
</body>
</html>
